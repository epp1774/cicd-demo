stages:
  - build
  - test
  - deploy

build_image:
  stage: build
  script:
    - echo "Building Docker image..."
    - docker build -t cicd-demo:latest .

run_tests:
  stage: test
  script:
    - echo "Running tests..."
    - pip install -r requirements.txt
    - python -m pytest test_app.py -v

deploy_to_kind:
  stage: deploy
  script:
    - echo "Deploying to Kind cluster..."
  only:
    - main
